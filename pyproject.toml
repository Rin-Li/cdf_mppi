[project]
name = "cdf-mppi"
version = "0.1.0"
description = "Motion planning with Configuration space Distance Fields"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "casadi==3.7.1",
    "matplotlib==3.10.0",
    "numpy==2.2.1",
    "pybullet==3.2.7",
    "torch==2.5.1",
    "pytorch-minimize==0.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planner", "enviornment", "cdf", "exp"]
